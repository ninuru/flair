program = "/bin/sh"
args = ["-i"]
cols = 80
rows = 6

[env]
PS1 = "ready> "

[[steps]]
action = "wait"
text = "ready> "

[[steps]]
action = "text"
text = "echo top-marker; seq 100 130\r"

[[steps]]
action = "wait"
text = "129"

[[steps]]
action = "key"
key = "a"
ctrl = true

[[steps]]
action = "key"
key = "["

[[steps]]
action = "wait"
text = "COPY"

[[steps]]
action = "key"
key = "g"

[[steps]]
action = "wait"
text = "top-marker"

[[steps]]
action = "key"
key = "G"
shift = true

[[steps]]
action = "key"
key = "x"

[[steps]]
action = "key"
key = "q"

[[steps]]
action = "key"
key = "z"

[[steps]]
action = "wait"
text = "ready> z"

[[steps]]
action = "key"
key = "a"
ctrl = true

[[steps]]
action = "key"
key = "["

[[steps]]
action = "wait"
text = "COPY"

program = "/bin/sh"
args = ["-i"]
cols = 80
rows = 6

[env]
PS1 = "ready> "

[[steps]]
action = "wait"
text = "ready> "

[[steps]]
action = "text"
text = "sleep 30\r"

[[steps]]
action = "wait"
text = "1:sleep"

[[steps]]
action = "key"
key = "a"
ctrl = true

[[steps]]
action = "key"
key = "c"

[[steps]]
action = "wait"
text = "2:sh"

[[steps]]
action = "text"
text = "cat\r"

[[steps]]
action = "wait"
text = "2:cat"

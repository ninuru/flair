name: Bug Report
description: Something in flair does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run `flair` 2. Press '...' 3. See '...'"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots or lines from `~/.local/state/flair/server.log` if relevant.
    validations:
      required: true
  - type: input
    id: flair-version
    attributes:
      label: flair version
      description: Output of `flair --version`.
    validations:
      required: true
  - type: input
    id: hyprland-version
    attributes:
      label: Hyprland version
      description: Output of `hyprctl version`.
    validations:
      required: false

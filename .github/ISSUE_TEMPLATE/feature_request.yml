name: Feature Request
description: Suggest an addition or change to flair.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should flair do instead? Mention the tmux or kitty equivalent if there is one.
    validations:
      required: true
  - type: input
    id: flair-version
    attributes:
      label: flair version
      description: Output of `flair --version`.
    validations:
      required: false
  - type: input
    id: hyprland-version
    attributes:
      label: Hyprland version
      description: Output of `hyprctl version`.
    validations:
      required: false
